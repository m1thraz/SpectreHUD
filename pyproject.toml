[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehud"
version = "2.0.1"
description = "Tactical CTF & Pentest Overlay — Cheatsheet, Loot Manager, Template-Engine, and Live Report HUD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "m1thraz" }
]
keywords = ["ctf", "pentesting", "hud", "overlay", "cheatsheet", "report", "hackthebox", "tryhackme"]
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pyinstaller>=6.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/m1thraz/SpectreHUD"
Repository = "https://github.com/m1thraz/SpectreHUD.git"

[project.scripts]
spectrehud = "spectrehud_launcher:main"

[tool.setuptools]
py-modules = ["main", "spectrehud_launcher", "create_desktop_shortcut"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "data*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.qss", "*.md", "*.svg", "*.ico"]
data = ["*.json", "*.svg", "*.ico"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 60
