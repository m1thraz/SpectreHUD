[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehud"
version = "2.0.8"
description = "Fast, transparent desktop cheatsheet HUD and pentest companion for CTFs and assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "m1thraz" }
]
keywords = ["ctf", "pentesting", "hud", "overlay", "cheatsheet", "report", "hackthebox", "tryhackme"]
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "cryptography>=42.0.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.5.0",
    "pyinstaller>=6.0.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/m1thraz/SpectreHUD"
Repository = "https://github.com/m1thraz/SpectreHUD.git"

[project.scripts]
spectrehud = "spectrehud_launcher:main"

[tool.setuptools]
py-modules = ["main", "spectrehud_launcher", "create_desktop_shortcut"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "data*", "resources*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.qss", "*.md", "*.svg", "*.ico", "*.desktop"]
data = ["*.json", "*.svg", "*.ico"]
resources = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
timeout = 60
markers = [
    "integration: cross-component, real Qt window, subprocess, or OS-boundary tests",
    "release: distribution, wheel, installer, and release-artifact tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    ".wheel-venv",
    "build",
    "dist",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # E402: Module level import not at top of file
    # Required for headless Qt env (QT_QPA_PLATFORM) and CLI dispatch before PyQt6 imports.
    "E402",
    # E501: Line length is formatted by ruff format; long URLs / docstrings preserved.
    "E501",
    # E203: Whitespace before ':' in slices
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]


