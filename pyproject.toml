[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehud"
version = "1.0.0"
description = "Tactical CTF & CLI Cheatsheet Desktop Overlay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "m1thraz" }
]
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/m1thraz/SpectreHUD"
Repository = "https://github.com/m1thraz/SpectreHUD.git"

[project.scripts]
spectrehud = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.qss", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
