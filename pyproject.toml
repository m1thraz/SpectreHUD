[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehud"
version = "2.1.5"
description = "Fast, transparent desktop cheatsheet HUD and pentest companion for CTFs and assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "m1thraz" }
]
keywords = ["ctf", "pentesting", "hud", "overlay", "cheatsheet", "report", "hackthebox", "tryhackme"]
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "cryptography>=42.0.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "wheel>=0.41.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
    "import-linter>=2.0",
]

[project.urls]
Homepage = "https://github.com/m1thraz/SpectreHUD"
Repository = "https://github.com/m1thraz/SpectreHUD.git"

[project.scripts]
spectrehud = "spectrehud_launcher:main"

[tool.setuptools]
py-modules = ["main", "spectrehud_launcher", "create_desktop_shortcut"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "data*", "resources*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.qss", "*.md", "*.svg", "*.ico", "*.desktop"]
data = ["*.json", "*.svg", "*.ico"]
resources = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
timeout = 60
markers = [
    "integration: cross-component, real Qt window, subprocess, or OS-boundary tests",
    "release: distribution, wheel, installer, and release-artifact tests",
    "ui: tests requiring PyQt6 widgets, windows, or GUI event loops",
    "unit: fast, isolated unit tests for pure domain and business logic",
    "architecture: import boundary, dependency cycle, and layer isolation tests",
    "slow: tests with long-running timeouts or intensive processing",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    ".wheel-venv",
    "build",
    "dist",
    "tmp",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # E402: Module level import not at top of file
    # Required for headless Qt env (QT_QPA_PLATFORM) and CLI dispatch before PyQt6 imports.
    "E402",
    # E501: Line length is formatted by ruff format; long URLs / docstrings preserved.
    "E501",
    # E203: Whitespace before ':' in slices
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.deptry]
extend_exclude = [".wheel-venv"]

[tool.deptry.package_module_name_map]
pyinstaller = "PyInstaller"
pytest-xdist = "xdist"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pytest-timeout",
    "pytest-xdist",
    "pytest-cov",
    "coverage",
    "wheel",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
files = ["core", "ui", "main.py"]

exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
    "^tmp/",
    "^\\.test-.*",
]

# Strict checking for headless core contracts, domain models, and services
[[tool.mypy.overrides]]
module = "core.*"
check_untyped_defs = true

# PyQt6 stubs in ui/ contain known C++ wrapper overrides and missing event nullability
[[tool.mypy.overrides]]
module = "ui.*"
disable_error_code = [
    "override",
    "call-overload",
    "union-attr",
    "attr-defined",
    "arg-type",
    "assignment",
    "index",
    "misc",
    "no-redef",
    "truthy-function",
    "return-value",
    "method-assign",
    "func-returns-value",
    "call-arg",
    "has-type",
]
