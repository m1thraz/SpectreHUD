[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrehud-docx-plugin"
version = "0.1.0"
description = "Official optional DOCX export plugin for SpectreHUD"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spectrehud_docx*"]
