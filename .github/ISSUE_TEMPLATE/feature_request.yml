name: Feature request
description: Propose a focused workflow or usability improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What CTF or authorized-lab workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      options:
        - Cheatsheet
        - Loot or Kanban
        - Clipboard history
        - Report editor or export
        - Projects or persistence
        - Settings or theming
        - Packaging or CI
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: The proposal fits a local, single-user desktop application.
          required: true
        - label: I searched existing issues and documentation first.
          required: true
