name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A newer commit on the same branch supersedes a still-running analysis.  This
# is intentional and makes GitHub's "cancelled" status explainable instead of
# leaving the default CodeQL setup to decide when scans overlap.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      # Python does not require an application build for CodeQL analysis.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
