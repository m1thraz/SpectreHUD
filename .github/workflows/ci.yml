name: CI - Test Suite

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux GUI / Qt Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb1 \
            libx11-xcb1 \
            libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint and Syntax Check (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=build,dist,.git,__pycache__

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest

      - name: Build Wheel Artifact
        run: |
          pip wheel . --no-deps -w dist/

      - name: Inspect Wheel Artifact
        run: |
          python scripts/verify_wheel.py dist/

      - name: Install Wheel Package (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install dist/*.whl
          spectrehud --version
          spectrehud --help

      - name: Install Wheel Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $wheel = (Get-Item dist/*.whl).FullName
          pip install $wheel
          spectrehud --version
          spectrehud --help

      - name: Build Standalone Windows Executable (EXE)
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        run: |
          python scripts/build_exe.py

      - name: Upload Windows Executable Artifact
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: SpectreHUD-Windows-x64
          path: dist/SpectreHUD.exe
          if-no-files-found: error
