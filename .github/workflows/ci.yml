name: CI - Test and Package Validation

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb1 libx11-xcb1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" coverage

      - name: Lint and syntax check
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=build,dist,.git,__pycache__

      - name: Run test suite
        if: ${{ !(runner.os == 'Linux' && matrix.python-version == '3.11') }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest

      - name: Run test suite with coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a coverage run -m pytest
          coverage report -m

  package:
    name: Package validation (Windows, Python 3.11)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -e ".[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q core ui data main.py scripts

      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python scripts/verify_wheel.py dist/

      - name: Install and smoke-test wheel in fresh environment
        run: |
          python -m venv .wheel-venv
          & .\.wheel-venv\Scripts\python.exe -m pip install --upgrade pip
          $wheel = (Get-Item dist/*.whl).FullName
          & .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          & .\.wheel-venv\Scripts\spectrehud.exe --version
          & .\.wheel-venv\Scripts\spectrehud.exe --help

      - name: Build standalone Windows executable
        run: |
          python scripts/build_exe.py

      - name: Smoke-test standalone Windows executable
        run: |
          & .\dist\SpectreHUD.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\SpectreHUD.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectreHUD-Windows-x64
          path: dist/SpectreHUD.exe
          if-no-files-found: error
