name: Release - Build & Publish Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Release Tag vs Package Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Verify Version Match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match pyproject version 'v${PACKAGE_VERSION}'"
            exit 1
          fi

  build-windows-exe:
    name: Build Windows Executable (.exe)
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -e ".[dev]"

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/run_tests.py full --no-parallel

      - name: Build Standalone Windows Executable
        run: |
          python scripts/build_exe.py

      - name: Smoke-test Standalone Windows Executable
        run: |
          & .\dist\SpectreHUD.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\SpectreHUD.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-executable
          path: dist/SpectreHUD.exe
          if-no-files-found: error

  build-linux-deb:
    name: Build Debian Package (.deb)
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 dpkg-dev binutils xvfb
          python3 -m pip install --upgrade pip
          python3 -m pip install -c constraints-release.txt -e ".[dev]"

      - name: Run Linux Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/run_tests.py full --no-parallel

      - name: Build Debian Package
        run: |
          python3 scripts/build_deb.py

      - name: Verify Debian Package Structure
        run: |
          DEB_FILE=$(ls dist/spectrehud_*_amd64.deb | head -n 1)
          echo "Inspecting Debian package: ${DEB_FILE}"
          dpkg-deb --info "${DEB_FILE}"
          dpkg-deb --contents "${DEB_FILE}"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-debian-package
          path: dist/spectrehud_*_amd64.deb
          if-no-files-found: error

  build-wheel:
    name: Build Python Wheel (.whl)
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -c constraints-release.txt setuptools wheel

      - name: Build Wheel Artifact
        run: |
          python3 -m pip wheel . --no-deps --no-build-isolation -w dist/
          python3 scripts/verify_wheel.py dist/

      - name: Install and Smoke-test Wheel in Virtual Environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv .wheel-test-env
          .wheel-test-env/bin/pip install --upgrade pip
          .wheel-test-env/bin/pip install -c constraints-release.txt dist/*.whl
          .wheel-test-env/bin/spectrehud --version
          .wheel-test-env/bin/spectrehud --help

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-linux-deb, build-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download All Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: |
          ls -lah release-assets

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: .
          format: 'spdx-json'
          output-file: 'release-assets/spectrehud.spdx.json'

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum SpectreHUD.exe spectrehud_*_amd64.deb *.whl spectrehud.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-assets/SpectreHUD.exe
            release-assets/spectrehud_*_amd64.deb
            release-assets/*.whl
            release-assets/spectrehud.spdx.json
            release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            release-assets/SpectreHUD.exe
            release-assets/spectrehud_*_amd64.deb
            release-assets/*.whl
            release-assets/spectrehud.spdx.json
            release-assets/SHA256SUMS
          generate_release_notes: true
