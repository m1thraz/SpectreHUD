name: Release - Build & Publish Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Release Tag vs Package Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Version Match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match pyproject version 'v${PACKAGE_VERSION}'"
            exit 1
          fi

  build-windows-exe:
    name: Build Windows Executable (.exe)
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m "not release" -q

      - name: Build Standalone Windows Executable
        run: |
          python scripts/build_exe.py

      - name: Smoke-test Standalone Windows Executable
        run: |
          & .\dist\SpectreHUD.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\SpectreHUD.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/SpectreHUD.exe
          if-no-files-found: error

  build-linux-deb:
    name: Build Debian Package (.deb)
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 dpkg-dev binutils xvfb
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run Linux Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pytest -m "not release" -q

      - name: Build Debian Package
        run: |
          python3 scripts/build_deb.py

      - name: Verify Debian Package Structure
        run: |
          DEB_FILE=$(ls dist/spectrehud_*_amd64.deb | head -n 1)
          echo "Inspecting Debian package: ${DEB_FILE}"
          dpkg-deb --info "${DEB_FILE}"
          dpkg-deb --contents "${DEB_FILE}"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-debian-package
          path: dist/spectrehud_*_amd64.deb
          if-no-files-found: error

  build-wheel:
    name: Build Python Wheel (.whl)
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build

      - name: Build Wheel Artifact
        run: |
          python3 -m build --wheel
          python3 scripts/verify_wheel.py dist/

      - name: Install and Smoke-test Wheel in Virtual Environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv .wheel-test-env
          .wheel-test-env/bin/pip install --upgrade pip
          .wheel-test-env/bin/pip install dist/*.whl
          .wheel-test-env/bin/spectrehud --version
          .wheel-test-env/bin/spectrehud --help

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-linux-deb, build-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: |
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SpectreHUD.exe
            release-assets/spectrehud_*_amd64.deb
            release-assets/*.whl
          generate_release_notes: true
