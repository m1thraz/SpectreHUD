name: Release - Build & Publish Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest

      - name: Build Standalone Windows Executable
        run: |
          python scripts/build_exe.py

      - name: Build Wheel Artifact
        run: |
          pip wheel . --no-deps --no-build-isolation -w dist/
          python scripts/verify_wheel.py dist/

      - name: Install and smoke-test Wheel Package in fresh environment
        run: |
          python -m venv .wheel-venv
          & .\.wheel-venv\Scripts\python.exe -m pip install --upgrade pip
          $wheel = (Get-Item dist/*.whl).FullName
          & .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          & .\.wheel-venv\Scripts\spectrehud.exe --version
          & .\.wheel-venv\Scripts\spectrehud.exe --help

      - name: Smoke-test Standalone Windows Executable
        run: |
          & .\dist\SpectreHUD.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\SpectreHUD.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/SpectreHUD.exe
            dist/*.whl
          generate_release_notes: true
